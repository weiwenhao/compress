name = "compress"
version = "v1.3.0"
authors = ["weiwenhao 1101140857@qq.com"]
description = "compress gzip"
license = "MIT"
type = "libc" # lib or bin

# 支持 .o 或者 .a link 文件, key 中需要包含 .a 或者 .o 从而能够方便的进行类型识别，从而判断不同的 key
# 填写相对路劲是，以当前编译的工作目录为基准。
[links]
libarchive = { linux_amd64 = 'lib/libarchive_linux_amd64.a', linux_arm64 = 'lib/libarchive_linux_arm64.a', darwin_amd64 = 'lib/libarchive_darwin_amd64.a', darwin_arm64 = 'lib/libarchive_darwin_arm64.a' }

[dependencies]
